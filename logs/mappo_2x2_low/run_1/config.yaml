algorithm: mappo
common:
  batch_size: 128
  buffer_size: 10000
  gamma: 0.95
  grad_clip: 10.0
  hidden_dim: 128
  lr: 0.0005
env:
  delta_time: 5
  demand: low
  max_green: 60
  min_green: 5
  network: 2x2
  num_seconds: 3600
  seed: 42
  use_gui: false
  yellow_time: 2
logging:
  log_dir: logs/
  tensorboard: true
  verbose: true
  wandb: false
  wandb_project: marl-traffic-tfm
mappo:
  actor_lr: 0.0003
  clip_eps: 0.2
  critic_lr: 0.001
  entropy_coef: 0.01
  gae_lambda: 0.95
  gamma: 0.99
  hidden_dim: 128
  ppo_epochs: 5
  rollout_length: 400
  value_loss_coef: 0.5
training:
  device: cpu
  eval_episodes: 5
  eval_every: 10000
  num_runs: 5
  save_every: 50000
  total_timesteps: 100000
