algorithm: maddpg
common:
  batch_size: 128
  buffer_size: 10000
  gamma: 0.95
  grad_clip: 10.0
  hidden_dim: 128
  lr: 0.0005
env:
  delta_time: 5
  demand: moderate
  max_green: 60
  min_green: 5
  network: 2x2
  num_seconds: 3600
  seed: 42
  use_gui: false
  yellow_time: 2
logging:
  log_dir: logs/
  tensorboard: true
  verbose: true
  wandb: false
  wandb_project: marl-traffic-tfm
maddpg:
  actor_lr: 0.0001
  batch_size: 128
  buffer_size: 100000
  critic_lr: 0.001
  gamma: 0.99
  hidden_dim: 128
  noise_std: 0.1
  tau: 0.01
  warmup_steps: 1000
training:
  device: cpu
  eval_episodes: 5
  eval_every: 10000
  num_runs: 5
  save_every: 50000
  total_timesteps: 1000
