algorithm: iql
common:
  batch_size: 128
  buffer_size: 10000
  gamma: 0.95
  grad_clip: 10.0
  hidden_dim: 128
  lr: 0.0005
env:
  delta_time: 5
  demand: low
  max_green: 60
  min_green: 5
  network: 2x2
  num_seconds: 3600
  seed: 42
  use_gui: false
  yellow_time: 2
iql:
  epsilon_decay: 150000
  epsilon_end: 0.05
  epsilon_start: 1.0
  gamma: 0.99
  hidden_dim: 128
  lr: 0.0005
  target_update_every: 200
logging:
  log_dir: logs/
  tensorboard: true
  verbose: true
  wandb: false
  wandb_project: marl-traffic-tfm
training:
  device: cpu
  eval_episodes: 5
  eval_every: 10000
  num_runs: 5
  save_every: 50000
  total_timesteps: 100000
